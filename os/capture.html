<body class="os-page-capture">

<nav class="os-nav">
    <div class="os-nav-inner">
        <a class="os-brand" href="index.html">
            <span class="os-brand-mark">C</span>
            <span class="os-brand-name">
                <b>Personal OS</b>
                <span>Colin · Knowledge</span>
            </span>
        </a>
        <div class="os-tabs">
            <a class="os-tab" href="index.html">发布台</a>
            <a class="os-tab active" href="capture.html">速记</a>
            <a class="os-tab" href="new.html">起草</a>
            <a class="os-tab" href="done.html">已发</a>
        </div>
        <div class="os-nav-right">
            <button class="os-theme-btn" aria-label="切换主题"><span class="theme-icon">🌙</span></button>
        </div>
    </div>
</nav>

<main class="os-wrap os-capture-wrap">

    <header class="os-head">
        <span class="os-kicker">Quick Capture</span>
        <h1>此刻在想<em>什么</em></h1>
        <p>一句话就够。它不会直接发表，先落在「起念」里，周日复盘时再看它值不值得往前推。</p>
    </header>

    <form class="os-capture-form" id="osCapture">
        <textarea class="os-capture-input" id="capText" rows="4"
            placeholder="今天读到的、突然想到的、想反驳的……" autofocus></textarea>

        <div class="os-capture-source">
            <input class="os-input" type="text" id="capSource" placeholder="来源（选填）：书名 / 文章 / 人名 / 自创">
        </div>

        <button class="os-btn os-capture-submit" type="submit">记下 → 起念</button>
    </form>

    <section class="os-capture-recent">
        <div class="os-capture-recent-head">
            <span class="os-kicker" style="font-size:.62rem;">最近的起念</span>
            <a class="os-link" href="index.html">看全部 →</a>
        </div>
        <div id="capRecent"></div>
    </section>

</main>
