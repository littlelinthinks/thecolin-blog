<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0a0a0a">
<link rel="icon" type="image/svg+xml" href="/images/favicon.svg">
<title>404 · 页面未找到 — COLIN</title>
<style>
  :root { --bg:#ffffff; --text:#000000; --light:#666666; --border:#e5e5e5; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0a0a0a; --text:#ffffff; --light:#a0a0a0; --border:#2a2a2a; }
  }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:var(--bg); color:var(--text);
         font-family:Georgia,"Times New Roman","Noto Serif SC","Songti SC",serif;
         text-align:center; padding:24px; }
  .num { font-size:clamp(90px,18vw,150px); font-weight:700; line-height:1; letter-spacing:-2px; }
  h1 { font-size:clamp(22px,4vw,30px); font-weight:700; margin:14px 0 8px; }
  .sub { color:var(--light); font-size:15px; margin:0 0 36px; line-height:1.8;
         font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; }
  .btn { display:inline-block; background:var(--text); color:var(--bg); text-decoration:none;
         padding:13px 34px; border-radius:999px; font-size:15px; font-weight:600;
         font-family:-apple-system,"PingFang SC",sans-serif; transition:opacity .2s ease; }
  .btn:hover { opacity:.82; }
  .home { margin-top:20px; font-size:13.5px; color:var(--light);
          font-family:-apple-system,"PingFang SC",sans-serif; }
  .home a { color:var(--text); text-decoration:underline; text-underline-offset:3px; }
</style>
</head>
<body>
<main>
  <div class="num">404</div>
  <h1>页面走丢了</h1>
  <p class="sub">你要找的页面不存在或已被移动。<br>回到首页，继续探索深邃思想。</p>
  <a class="btn" href="/">返回首页</a>
  <p class="home">或浏览 <a href="/archive.html">文章归档</a> · <a href="/topics.html">思维模型</a></p>
</main>
</body>
</html>
