    <style>
        :root{
            --bg-primary:#ffffff;--bg-secondary:#f5f5f5;--bg-card:#ffffff;
            --text-primary:#000000;--text-secondary:#666666;--border:#e5e5e5;
            --gold:#C9A84C;
        }
        [data-theme="dark"]{
            --bg-primary:#0a0a0a;--bg-secondary:#141414;--bg-card:#141414;
            --text-primary:#ffffff;--text-secondary:#a0a0a0;--border:#2a2a2a;
        }
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Noto Serif SC',serif;line-height:1.6;background:var(--bg-primary);color:var(--text-primary);transition:background .3s,color .3s}

        .site-nav{background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);position:fixed;top:0;left:0;right:0;z-index:1000;display:flex;align-items:center;justify-content:space-between;padding:.9rem 2rem}
        [data-theme="dark"] .site-nav{background:rgba(10,10,10,.96)}
        .site-nav .logo{font-family:"Playfair Display",Georgia,serif;font-size:1.5rem;font-weight:900;color:var(--text-primary);text-decoration:none;letter-spacing:-.5px}
        .site-nav .nav-links{display:flex;gap:1.6rem;align-items:center;list-style:none}
        .site-nav .nav-links a{color:var(--text-primary);text-decoration:none;font-size:.92rem;opacity:.8;transition:opacity .2s}
        .site-nav .nav-links a:hover{opacity:1}
        .nav-tools{display:flex;gap:.6rem;align-items:center}
        .lang-switcher{display:flex;gap:.3rem}
        .lang-switcher button{padding:.35rem .6rem;border:1px solid var(--border);background:var(--bg-card);border-radius:8px;cursor:pointer;font-size:.8rem;font-weight:600;color:var(--text-secondary);transition:all .2s}
        .lang-switcher button.active{background:var(--text-primary);color:var(--bg-card);border-color:var(--text-primary)}
        .theme-toggle{width:40px;height:40px;border-radius:50%;border:1px solid var(--border);background:var(--bg-card);cursor:pointer;font-size:1.1rem;transition:all .2s}
        .theme-toggle:hover{border-color:var(--gold)}
        @media(max-width:760px){.site-nav .nav-links{display:none}}

        .container{max-width:1100px;margin:0 auto;padding:110px 24px 80px}
        .page-head{text-align:center;margin-bottom:36px}
        .page-head h1{font-family:"Playfair Display",Georgia,serif;font-size:clamp(2rem,5vw,3rem);font-weight:900;margin-bottom:10px;letter-spacing:-.02em}
        .page-head p{color:var(--text-secondary);font-size:1.05rem}

        .topic-tabs{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:40px}
        .topic-tabs button{padding:.5rem 1.3rem;border:1px solid var(--border);background:var(--bg-card);border-radius:24px;cursor:pointer;font-size:.9rem;color:var(--text-secondary);transition:all .2s}
        .topic-tabs button:hover{border-color:var(--gold);color:var(--text-primary)}
        .topic-tabs button.active{background:var(--gold);color:#fff;border-color:var(--gold)}

        .topic-section{margin-bottom:46px}
        .topic-section h2{font-family:"Playfair Display",Georgia,serif;font-size:1.5rem;font-weight:700;margin-bottom:18px;padding-bottom:12px;border-bottom:2px solid var(--border)}
        .topic-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px}
        .topic-card{display:block;text-decoration:none;background:var(--bg-card);border:1px solid var(--border);border-radius:14px;padding:22px;transition:transform .25s,box-shadow .25s,border-color .25s;box-shadow:0 2px 10px rgba(0,0,0,.05)}
        .topic-card:hover{transform:translateY(-5px);box-shadow:0 14px 34px rgba(0,0,0,.13);border-color:var(--gold)}
        .topic-card .tc-tag{display:inline-block;font-size:.68rem;letter-spacing:2px;text-transform:uppercase;color:var(--gold);border:1px solid var(--gold);border-radius:20px;padding:3px 11px;margin-bottom:13px}
        .topic-card .tc-title{font-family:"Playfair Display",Georgia,serif;font-size:1.18rem;font-weight:700;color:var(--text-primary);margin-bottom:9px;line-height:1.35}
        .topic-card .tc-excerpt{font-size:.9rem;color:var(--text-secondary);line-height:1.65;margin-bottom:15px}
        .topic-card .tc-meta{font-size:.8rem;color:var(--text-secondary);display:flex;gap:14px}
        .no-cards{color:var(--text-secondary);text-align:center;padding:30px}
    </style>
</head>
<body>
    <header class="site-nav">
        <a href="index.html" class="logo">COLIN</a>
        <ul class="nav-links">
            <li><a href="index.html">首页</a></li>
            <li><a href="archive.html">文章</a></li>
            <li><a href="wisdom.html">心智折叠</a></li>
            <li><a href="subscribe.html">订阅</a></li>
            <li><a href="https://readswithcolin.com" target="_blank" rel="noopener">读书</a></li>
        </ul>
        <div class="nav-tools">
            <div class="lang-switcher">
                <button data-lang="zh" class="active">中</button>
                <button data-lang="en">EN</button>
            </div>
            <button class="theme-toggle" aria-label="切换主题">🌙</button>
        </div>
    </header>

    <main class="container">
        <div class="page-head">
            <h1 data-zh="🧠 思维模型 · 专题" data-en="🧠 Mental Models">🧠 思维模型 · 专题</h1>
            <p data-zh="西方经典、底层心智与人性拆解——把认知变成可扫读、可复用的卡片。" data-en="Western classics, metacognition and human nature — cognition as scannable, reusable cards.">西方经典、底层心智与人性拆解——把认知变成可扫读、可复用的卡片。</p>
        </div>

        <div class="topic-tabs" id="topicTabs">
            <button data-filter="all" class="active" data-zh="全部" data-en="All">全部</button>
            <button data-filter="mind" data-zh="思维模型" data-en="Mental Models">思维模型</button>
            <button data-filter="notes" data-zh="小Lin的笔记" data-en="Lin's Notes">小Lin的笔记</button>
        </div>

        <div id="topicRoot"><div class="no-cards">加载中…</div></div>
    </main>

    <script>
        const MIND_SERIES = ['western-classics','tiandao-humanity','metacognition'];
        const NOTES_SERIES = ['lin-notes'];
        let _lang = localStorage.getItem('preferred-lang') || 'zh';
        let _filter = 'all';
        let _articles = [];

        function applyTheme(t){
            document.documentElement.setAttribute('data-theme', t);
            localStorage.setItem('preferred-theme', t);
            document.querySelector('.theme-toggle').textContent = t === 'dark' ? '☀️' : '🌙';
        }
        (function initTheme(){
            const t = localStorage.getItem('preferred-theme') || 'light';
            applyTheme(t);
        })();
        document.querySelector('.theme-toggle').addEventListener('click', () => {
            applyTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
        });

        function setLang(lang){
            _lang = lang;
            localStorage.setItem('preferred-lang', lang);
            document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
            document.querySelectorAll('.lang-switcher button').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
            document.querySelectorAll('[data-zh][data-en]').forEach(el => {
                if (el.tagName === 'INPUT') el.placeholder = el.dataset[lang+'Placeholder'] || el.dataset[lang];
                else if (el.tagName === 'META') { if (el.dataset[lang+'Content']) el.setAttribute('content', el.dataset[lang+'Content']); }
                else if (el.tagName === 'TITLE') el.textContent = el.dataset[lang];
                else el.textContent = el.dataset[lang];
            });
            renderTopics();
        }
        document.querySelectorAll('.lang-switcher button').forEach(b => b.addEventListener('click', () => setLang(b.dataset.lang)));

        document.querySelectorAll('.topic-tabs button').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.topic-tabs button').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                _filter = btn.dataset.filter;
                renderTopics();
            });
        });

        function inFilter(series){
            if (_filter === 'all') return true;
            if (_filter === 'mind') return MIND_SERIES.includes(series);
            if (_filter === 'notes') return NOTES_SERIES.includes(series);
            return true;
        }

        function renderTopics(){
            const root = document.getElementById('topicRoot');
            const groups = {};
            _articles.filter(a => inFilter(a.series)).forEach(a => {
                const sid = a.series || 'uncat';
                (groups[sid] = groups[sid] || []).push(a);
            });
            const entries = Object.entries(groups);
            if (!entries.length){ root.innerHTML = '<div class="no-cards">该分类暂无文章。</div>'; return; }
            root.innerHTML = entries.map(([sid, items]) => {
                const name = items[0][_lang === 'zh' ? 'seriesName' : 'seriesNameEn'] || sid;
                const cards = items.map(a => {
                    const title = _lang === 'zh' ? (a.title || a.titleEn) : (a.titleEn || a.title);
                    const excerpt = _lang === 'zh' ? (a.excerpt || a.excerptEn) : (a.excerptEn || a.excerpt);
                    const tag = _lang === 'zh' ? (a.seriesName || '') : (a.seriesNameEn || '');
                    const url = a.url || (a.filename ? a.filename.replace(/\/$/, '') + '/' : '#');
                    return `<a class="topic-card" href="${url}">
                        <span class="tc-tag">${tag}</span>
                        <div class="tc-title">${title}</div>
                        <div class="tc-excerpt">${excerpt || ''}</div>
                        <div class="tc-meta"><span>${a.date || a.dateEn || ''}</span><span>${_lang === 'zh' ? (a.readTime || '') : (a.readTimeEn || '')}</span></div>
                    </a>`;
                }).join('');
                return `<section class="topic-section"><h2>${name}</h2><div class="topic-grid">${cards}</div></section>`;
            }).join('');
        }

        fetch('articles.json').then(r => r.json()).then(data => {
            _articles = Array.isArray(data) ? data : (data.items || []);
            renderTopics();
        }).catch(() => {
            document.getElementById('topicRoot').innerHTML = '<div class="no-cards">文章数据加载失败。</div>';
        });
    </script>
</body>
